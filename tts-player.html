<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TTS Player</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #box{position:absolute;inset:0;} #box iframe{width:100%;height:100%;border:0;}
  .band{position:absolute;left:0;right:0;background:#000;z-index:2;pointer-events:none;}
  .bt{top:0;height:18%;} .bb{bottom:0;height:16%;}
  #mask{position:absolute;inset:0;z-index:3;pointer-events:none;display:block;}
  #ad{display:none;position:absolute;inset:0;z-index:4;background:rgba(5,8,16,.94);color:#fff;
      font:700 14px -apple-system,sans-serif;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;}
  #ad small{font-weight:400;font-size:12px;color:#9fb0c6;}
  #blk{position:absolute;inset:0;z-index:5;background:transparent;}
  /* Cinematic 3-2-1 startup shield — also hides YouTube's ~2s title/channel/controls info card. */
  #cover{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at center,#0a1a3a 0%,#04070f 72%);transition:opacity .3s;overflow:hidden;}
  #cover::before{content:"";position:absolute;inset:0;background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);opacity:.5;}
  #cd{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;}
  .cd-ring{position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(from -90deg, rgba(0,206,209,0) 0deg, rgba(0,206,209,.9) 300deg, rgba(0,206,209,0) 340deg);
      -webkit-mask:radial-gradient(circle, transparent 63%, #000 65%);mask:radial-gradient(circle, transparent 63%, #000 65%);
      animation:cdsweep .9s linear infinite;}
  .cd-ring2{position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.14);}
  #cdnum{font:900 96px/1 -apple-system,"Segoe UI",sans-serif;color:#fff;text-shadow:0 0 26px rgba(0,206,209,.85),0 0 6px rgba(255,255,255,.6);}
  @keyframes cdsweep{to{transform:rotate(360deg);}}
  @keyframes cdpop{0%{transform:scale(1.6);opacity:0}22%{opacity:1}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
  <div id="box"><div id="yt"></div></div>
  <div class="band bt"></div><div class="band bb"></div>
  <svg id="mask" width="100%" height="100%"><defs><mask id="ph"><rect width="100%" height="100%" fill="#fff"/><ellipse cx="50%" cy="50%" rx="40" ry="28" fill="#000"/></mask></defs><rect width="100%" height="100%" fill="#000" mask="url(#ph)"/></svg>
  <div id="ad">Ad &mdash; muted<small>your clip starts the moment it ends</small></div>
  <div id="blk"></div>
  <div id="cover"><div id="cd"><div class="cd-ring"></div><div class="cd-ring2"></div><div id="cdnum"></div></div></div>
<script>
  // Hosted YouTube proxy for iOS WKWebView: real https origin → valid Referer (fixes error 153).
  // Boxes the title, hides+mutes ads, disables captions, and runs a cinematic 3-2-1 shield over
  // YouTube's startup info card before revealing clean video. postMessages state to the parent app.
  var q = new URLSearchParams(location.search);
  var vid = q.get("v"), start = parseInt(q.get("start") || "0", 10) || 0;
  var player = null, adFlag = false, started = false;
  function post(m){ try { (window.parent || window).postMessage(m, "*"); } catch(e){} }
  function pop(el){ el.style.animation = "none"; void el.offsetWidth; el.style.animation = "cdpop .9s ease-out"; }
  function runCountdown(done){
    var num = document.getElementById("cdnum"); var n = 3;
    num.textContent = n; pop(num);
    var iv = setInterval(function(){ n--; if (n <= 0) { clearInterval(iv); done(); return; } num.textContent = n; pop(num); }, 900);
  }
  var s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player("yt", { videoId: vid, width: "100%", height: "100%",
      playerVars: { controls: 0, modestbranding: 1, rel: 0, playsinline: 1, fs: 0, iv_load_policy: 3, disablekb: 1, cc_load_policy: 0, start: start, origin: location.origin },
      events: {
        onReady: function(e){ try { e.target.mute(); } catch(x){} try { e.target.playVideo(); } catch(x){} },
        onStateChange: function(e){
          if (e.data === YT.PlayerState.PLAYING) {
            var isAd = false; try { var vd = player.getVideoData(); isAd = !vd || !vd.video_id || vd.video_id !== vid; } catch(x){}
            if (isAd) {
              document.getElementById("mask").style.display = "none";
              document.getElementById("cover").style.display = "none";
              document.getElementById("ad").style.display = "flex";
              try { player.mute(); } catch(x){}
              if (!adFlag) { adFlag = true; post({ tts: "ad" }); }
            } else {
              document.getElementById("mask").style.display = "none";
              document.getElementById("ad").style.display = "none";
              try { player.unMute(); player.setVolume(100); } catch(x){}
              if (!started) {
                started = true;
                runCountdown(function(){          // 3-2-1 over ~2.7s, then reveal clean video + start the app clock
                  var c = document.getElementById("cover"); c.style.opacity = "0";
                  setTimeout(function(){ c.style.display = "none"; }, 300);
                  post({ tts: "play" });
                });
              }
            }
          }
        },
        onError: function(e){ post({ tts: "err", code: (e && e.data) }); }
      } });
  };
</script>
</body>
</html>
