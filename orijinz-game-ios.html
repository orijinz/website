<!DOCTYPE html>
<!-- LAST UPDATED: 2026-07-14 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orijinz Daily Game</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0e0e12;
            color: #e0e0e0;
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 24px;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(240, 200, 96, 0.2);
            border-top: 4px solid #f0c860;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p {
            color: #a0a8b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="loading">
    <div class="spinner"></div>
    <h1>Loading Game</h1>
    <p>Starting your game...</p>
</div>

<script>
// Get game ID from query params
var params = new URLSearchParams(window.location.search);
var gameId = params.get('game') || 'odwordsandphrases';

// Map game IDs to URLs
var gameUrls = {
    'odwordsandphrases': 'https://www.entspire.com/odwordsandphrases',
    'od70s-songs': 'https://www.entspire.com/od70s-songs',
    'odcovers': 'https://www.entspire.com/odcovers',
    'odmovies': 'https://www.entspire.com/odmovies',
    'odslogans': 'https://www.entspire.com/odslogans',
    'odquotes': 'https://www.entspire.com/odquotes',
    'odbooks': 'https://www.entspire.com/odbooks'
};

var gameUrl = gameUrls[gameId] || gameUrls['odwordsandphrases'];

// Wait for AppDelegate to inject ORIJINZ_IAP_ACTIVE, then navigate
function navigateToGame() {
    try {
        window.top.location.href = gameUrl;
    } catch (e) {
        window.location.href = gameUrl;
    }
}

// Delay to ensure injection happens before navigation
setTimeout(navigateToGame, 800);

// Safety timeout: if still on this page after 10 seconds, something went wrong
setTimeout(function() {
    if (window.location.pathname.includes('orijinz-game-ios')) {
        document.querySelector('.loading').innerHTML = '<p style="color:#e57373;">Game failed to load. Please try again.</p>';
        setTimeout(navigateToGame, 2000);
    }
}, 10000);
</script>

</body>
</html>
