<!DOCTYPE html>
<!-- LAST UPDATED: 2026-07-15 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orijinz Daily Game</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0e0e12;
            color: #e0e0e0;
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 24px;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(240, 200, 96, 0.2);
            border-top: 4px solid #f0c860;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p {
            color: #a0a8b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #f0c860;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:active { background: #d4a438; }
        .debug {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            font-size: 0.8rem;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body>

<div class="loading">
    <div class="spinner"></div>
    <h1 id="title">Loading Game</h1>
    <p id="message">Starting your game...</p>
    <button class="btn" id="backBtn" onclick="goBack()" style="display:none;">Back to Home</button>
</div>

<div class="debug" id="debug"></div>

<script>
// Get game ID from query params
var params = new URLSearchParams(window.location.search);
var gameId = params.get('game') || 'odwordsandphrases';

// Map game IDs to URLs
var gameUrls = {
    'odwordsandphrases': 'https://www.entspire.com/odwordsandphrases?fromWrapper=1',
    'od70s-songs': 'https://www.entspire.com/od70s-songs?fromWrapper=1',
    'odcovers': 'https://www.entspire.com/odcovers?fromWrapper=1',
    'odmovies': 'https://www.entspire.com/odmovies?fromWrapper=1',
    'odslogans': 'https://www.entspire.com/odslogans?fromWrapper=1',
    'odquotes': 'https://www.entspire.com/odquotes?fromWrapper=1',
    'odbooks': 'https://www.entspire.com/odbooks?fromWrapper=1'
};

var gameUrl = gameUrls[gameId] || gameUrls['odwordsandphrases'];

function goBack() {
    try {
        window.top.location.href = 'https://orijinz.github.io/website/homepage-v2.html';
    } catch (e) {
        window.location.href = 'https://orijinz.github.io/website/homepage-v2.html';
    }
}

// Check subscription status from URL parameter (passed by iOS app) and window variable (set by didFinish)
var iapActiveParam = params.get('iapActive') === 'true';
var iapActive = iapActiveParam || (typeof window.ORIJINZ_IAP_ACTIVE !== 'undefined' ? window.ORIJINZ_IAP_ACTIVE : false);

// Show debug info
var debugEl = document.getElementById('debug');
var debugMsg = 'iapActive=' + iapActive + ' (fromURL=' + iapActiveParam + ')\nURL: ' + window.location.search.substring(0, 100);
debugEl.textContent = debugMsg;
debugEl.style.display = 'block';

console.log('Game wrapper loaded. iapActive from URL:', iapActiveParam, 'iapActive final:', iapActive);
console.log('URL params:', window.location.search);

// Store in sessionStorage so the Wix game page can read it
if (iapActive) {
    try { sessionStorage.setItem('orijinzIAPActive', 'true'); } catch(e) {}
}

if (iapActive === true) {
    console.log('Subscribed - navigating to game');
    // Subscribed: navigate to game
    navigateToGame();
} else {
    // If NOT subscribed, don't try to load game (it will redirect to subscribe)
    // But first wait a moment in case the flag is being injected
    var checkAttempts = 0;
    var checkInterval = setInterval(function() {
        checkAttempts++;

        // Once flag becomes available or timeout, make final decision
        if ((typeof window.ORIJINZ_IAP_ACTIVE !== 'undefined' && window.ORIJINZ_IAP_ACTIVE) || checkAttempts > 40) {
            clearInterval(checkInterval);

            if (window.ORIJINZ_IAP_ACTIVE === true) {
                try { sessionStorage.setItem('orijinzIAPActive', 'true'); } catch(e) {}
                navigateToGame();
            } else {
                document.getElementById('title').textContent = 'Not Subscribed';
                document.getElementById('message').textContent = 'Please subscribe to play this game.';
                document.getElementById('backBtn').style.display = 'inline-block';
            }
            return;
        }
    }, 50);
}

function navigateToGame() {
    // Pass session token to game page so it can authenticate with Wix
    var sessionToken = sessionStorage.getItem('wixSessionToken');
    var urlWithToken = gameUrl;
    if (sessionToken) {
        var separator = gameUrl.includes('?') ? '&' : '?';
        urlWithToken = gameUrl + separator + 'sessionToken=' + encodeURIComponent(sessionToken);
    }
    try {
        window.top.location.href = urlWithToken;
    } catch (e) {
        window.location.href = urlWithToken;
    }
}

// Safety: if stuck after 10s, show error
setTimeout(function() {
    if (window.location.pathname.includes('orijinz-game-ios')) {
        document.getElementById('title').textContent = 'Game Failed to Load';
        document.getElementById('message').textContent = 'Please try again.';
        document.getElementById('backBtn').style.display = 'inline-block';
    }
}, 10000);
</script>

</body>
</html>
